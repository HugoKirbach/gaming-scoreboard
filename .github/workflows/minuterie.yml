name: Minuterie

# Lancée à la fin de chaque mise à jour du classement : attend ~1 h puis relance la mise à jour.
# Plus fiable que la programmation « schedule » de GitHub, qui saute souvent des heures.
# Une seule minuterie à la fois : une nouvelle annule l'ancienne.

on:
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: minuterie
  cancel-in-progress: true

jobs:
  attendre:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Attendre la prochaine mise à jour
        run: sleep 3420   # 57 min (+ ~1-3 min de mise à jour = environ une fois par heure)

      - name: Lancer la mise à jour du classement
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run classement.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
