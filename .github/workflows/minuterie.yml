name: Minuterie

# Lancée à la fin de chaque mise à jour du classement : attend la prochaine heure de mise à jour
# (UPDATE_TIME, heure de Paris) puis relance la mise à jour. Une seule par jour.
# Une tâche GitHub ne peut pas dépasser 6 h : au-delà de MAX_WAIT, la minuterie se relaie
# en lançant une nouvelle minuterie.
# Plus fiable que la programmation « schedule » de GitHub, qui saute ou retarde souvent les créneaux.
# Une seule minuterie à la fois : une nouvelle annule l'ancienne.

on:
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: minuterie
  cancel-in-progress: true

jobs:
  attendre:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - name: Attendre la prochaine mise à jour
        id: wait
        env:
          UPDATE_TIME: "03:00"   # heure de Paris
          MARGIN: 600            # une mise à jour faite moins de 10 min avant compte pour celle du jour
          MAX_WAIT: 19800        # 5 h 30
        run: |
          now=${NOW_OVERRIDE:-$(date +%s)}
          day=$(TZ=Europe/Paris date -d "@$now" +%F)
          target=$(TZ=Europe/Paris date -d "$day $UPDATE_TIME" +%s)
          if [ "$target" -le $((now + MARGIN)) ]; then
            day=$(TZ=Europe/Paris date -d "$day + 1 day" +%F)
            target=$(TZ=Europe/Paris date -d "$day $UPDATE_TIME" +%s)
          fi
          echo "Prochaine mise à jour le $(TZ=Europe/Paris date -d "@$target" '+%d/%m à %H:%M') (heure de Paris)."

          wait=$((target - now))
          if [ "$wait" -gt "$MAX_WAIT" ]; then
            echo "Attente de $((MAX_WAIT / 60)) min, puis relais par une nouvelle minuterie."
            echo "next=minuterie" >> "$GITHUB_OUTPUT"
            ${DRY_RUN:+echo} sleep "$MAX_WAIT"
          else
            echo "Mise à jour dans $((wait / 60)) min."
            echo "next=classement" >> "$GITHUB_OUTPUT"
            ${DRY_RUN:+echo} sleep "$wait"
          fi

      - name: Lancer la suite
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "${{ steps.wait.outputs.next }}.yml" --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
