name: Mise à jour du classement

on:
  schedule:
    - cron: "30 2 * * *"      # secours (3 h 30 à Paris l'hiver) : ne fait rien si la minuterie tourne
  workflow_dispatch:          # bouton « Run workflow » dans l'onglet Actions
  push:
    branches: [main]          # relance quand tu modifies config.json ou la page

permissions:
  contents: write   # pour sauvegarder docs/history.json
  pages: write      # pour publier le site
  id-token: write
  actions: write    # pour relancer la minuterie

concurrency:
  group: classement
  cancel-in-progress: false

jobs:
  # Créneau de secours : la minuterie (minuterie.yml) programme normalement la mise à jour
  # quotidienne de 3 h. Si elle tourne, on ne fait rien ; si elle s'est arrêtée, on la relance.
  garde:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          alive=$(gh run list -R "$REPO" -w minuterie.yml -L 10 --json status -q '[.[] | select(.status != "completed")] | length')
          if [ "$alive" -gt 0 ]; then
            echo "La minuterie tourne : rien à faire."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(gh run list -R "$REPO" -w classement.yml -L 30 --json conclusion,createdAt,event \
            -q '[.[] | select(.conclusion == "success" and .event != "schedule")][0].createdAt // ""')
          if [ -n "$last" ] && [ $(( $(date +%s) - $(date -d "$last" +%s) )) -lt 72000 ]; then
            echo "Minuterie arrêtée mais mise à jour récente ($last) : on relance seulement la minuterie."
            gh workflow run minuterie.yml -R "$REPO" --ref "${{ github.ref_name }}"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Minuterie arrêtée : mise à jour de secours."
          fi

  update:
    needs: garde
    if: needs.garde.outputs.skip != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Dernière version de la branche (et non celle du déclenchement), pour repartir
      # de l'historique poussé par une mise à jour qui aurait tourné juste avant.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        run: npm install --no-audit --no-fund

      - name: Lire les temps de jeu sur le PSN
        run: node scripts/update.mjs
        env:
          PSN_NPSSO: ${{ secrets.PSN_NPSSO }}

      - name: Sauvegarder l'historique
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/history.json
          if git diff --cached --quiet; then
            echo "Historique inchangé."
          else
            git commit -m "Classement mis à jour"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v4

      # Programme la prochaine mise à jour dans ~1 h (voir minuterie.yml), même si une étape a échoué.
      - name: Programmer la prochaine mise à jour
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run minuterie.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
