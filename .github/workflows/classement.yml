name: Mise à jour du classement

on:
  schedule:
    - cron: "17 11-22 * * *" # filet de sécurité (UTC, hors heures creuses de Paris) : GitHub saute souvent ces créneaux, la minuterie fait le vrai travail
  workflow_dispatch:          # bouton « Run workflow » dans l'onglet Actions
  push:
    branches: [main]          # relance quand tu modifies config.json ou la page

permissions:
  contents: write   # pour sauvegarder docs/history.json
  pages: write      # pour publier le site
  id-token: write
  actions: write    # pour relancer la minuterie

concurrency:
  group: classement
  cancel-in-progress: false

jobs:
  # GitHub lance parfois les créneaux programmés avec des heures de retard :
  # on ignore ceux qui tombent dans les heures creuses de Paris (1 h - 12 h).
  heures-creuses:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        run: |
          h=$(TZ=Europe/Paris date +%-H)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$h" -ge 1 ] && [ "$h" -lt 12 ]; then
            echo "Heures creuses à Paris (${h} h) : créneau programmé ignoré."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

  update:
    needs: heures-creuses
    if: needs.heures-creuses.outputs.skip != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Dernière version de la branche (et non celle du déclenchement), pour repartir
      # de l'historique poussé par une mise à jour qui aurait tourné juste avant.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        run: npm install --no-audit --no-fund

      - name: Lire les temps de jeu sur le PSN
        run: node scripts/update.mjs
        env:
          PSN_NPSSO: ${{ secrets.PSN_NPSSO }}

      - name: Sauvegarder l'historique
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/history.json
          if git diff --cached --quiet; then
            echo "Historique inchangé."
          else
            git commit -m "Classement mis à jour"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v4

      # Programme la prochaine mise à jour dans ~1 h (voir minuterie.yml), même si une étape a échoué.
      - name: Programmer la prochaine mise à jour
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run minuterie.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
